services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - reach-models:/root/.reach/models
      - reach-data:/tmp/reach-uploads
      - reach-output:/tmp/reach-output
    environment:
      - REACH_MODELS_DIR=/root/.reach/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile.webui
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  reach-models:
  reach-data:
  reach-output:
